<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#0b0d10;--fg:#d8dee6;--dim:#6b7480;--acc:#7CFFB2;--line:#1f242b}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:13px}
  #wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  #stage{position:relative;width:320px;height:240px;background:#06080a;border:1px solid var(--line)}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
  #idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:12px}
  #count{position:absolute;right:8px;top:6px;color:var(--acc);font-size:28px;display:none}
  #bar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0}
  #guide{position:absolute;inset:30px 60px;border:1px dashed #ffffff30;display:none}
  button{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:9px 18px;font-family:inherit;font-size:13px;cursor:pointer;border-radius:0}
  button:hover{background:var(--acc);color:var(--bg)} button:disabled{opacity:.4;cursor:default}
  #side{flex:1;min-width:200px} #msg{color:var(--dim);line-height:1.6;margin-top:10px;min-height:60px} .err{color:#ff7a7a!important}
  canvas{display:none}
</style></head>
<body>
<div id="wrap">
  <div id="stage"><video id="v" playsinline muted></video><div id="idle">camera + mic preview<br>appears after you press start</div>
    <div id="guide"></div><div id="count"></div><div id="bar"></div></div>
  <div id="side">
    <button id="go">▶ start (5 s capture)</button>
    <div id="msg">Say one command (go / stop / left / right / up / down) and, at the same time, show a hand gesture:
      swipe left / right / up / down, hold an open palm (go) or a fist (stop). Keep your hand in front of your face, inside the dashed box.</div>
  </div>
</div>
<canvas id="c" width="160" height="120"></canvas>
<script>
const DUR = 5000, FPS = 10, TARGET_SR = 16000;
const $ = id => document.getElementById(id);
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, data), "*");
const setH = () => send("streamlit:setFrameHeight", {height: 270});
window.addEventListener("message", e => { if (e.data && e.data.type === "streamlit:render") setH(); });
send("streamlit:componentReady", {apiVersion: 1}); setH();

function b64(u8){ let s=""; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function resample(chunks, srcSr){
  let n=0; chunks.forEach(c=>n+=c.length); const x=new Float32Array(n); let o=0; chunks.forEach(c=>{x.set(c,o);o+=c.length;});
  const ratio=srcSr/TARGET_SR, m=Math.floor(n/ratio), y=new Int16Array(m);
  for(let i=0;i<m;i++){ const p=i*ratio, i0=Math.floor(p), f=p-i0, a=x[i0], b=x[Math.min(i0+1,n-1)];
    y[i]=Math.max(-1,Math.min(1,a+(b-a)*f))*32767; }
  return y;
}
function fail(t){ $("msg").textContent=t; $("msg").className="err"; $("go").disabled=false; $("go").textContent="▶ try again"; }

$("go").onclick = async () => {
  $("go").disabled = true; $("msg").className=""; $("msg").textContent="requesting camera + microphone permission…";
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}, audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
  catch(e){ return fail("Permission denied or no device: " + e.name + ". Allow camera + microphone in the browser address bar and press start again."); }
  const v=$("v"); v.srcObject=stream; await v.play(); v.style.display="block"; $("idle").style.display="none"; $("guide").style.display="block"; $("count").style.display="block";
  // audio
  const ac = new (window.AudioContext||window.webkitAudioContext)(); const src = ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
  const proc = ac.createScriptProcessor(4096,1,1); const chunks=[]; proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  const mute = ac.createGain(); mute.gain.value=0; src.connect(proc); proc.connect(mute); mute.connect(ac.destination);
  // video frames (mirrored so the user's left = image left)
  const cv=$("c"), cx=cv.getContext("2d"); const frames=[]; const t0=performance.now(); let tick;
  $("msg").textContent="recording… speak + gesture now";
  tick = setInterval(()=>{
    const t=performance.now()-t0; cx.save(); cx.translate(160,0); cx.scale(-1,1); cx.drawImage(v,0,0,160,120); cx.restore();
    frames.push(cv.toDataURL("image/jpeg",0.7).split(",")[1]);
    $("count").textContent = Math.max(0,Math.ceil((DUR-t)/1000)); $("bar").style.width = Math.min(100,t/DUR*100)+"%";
    if(t>=DUR){ clearInterval(tick); finish(); }
  }, 1000/FPS);
  async function finish(){
    const elapsed=(performance.now()-t0)/1000; const srcSr=ac.sampleRate;
    proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t=>t.stop()); ac.close(); v.style.display="none"; $("guide").style.display="none"; $("count").style.display="none";
    $("idle").style.display="flex"; $("idle").textContent="captured ✓"; $("bar").style.width="0";
    const pcm = resample(chunks, srcSr);
    $("msg").textContent = `captured ${frames.length} frames + ${(pcm.length/TARGET_SR).toFixed(2)} s audio — processing in Python…`;
    $("go").disabled=false; $("go").textContent="▶ record again";
    send("streamlit:setComponentValue", {dataType:"json", value:{id:Date.now(), audio:b64(new Uint8Array(pcm.buffer)), sr:TARGET_SR, frames:frames, elapsed:elapsed, src_sr:srcSr}});
  }
};
</script></body></html>
